<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ズボラ家計簿は引っ越しました</title>
<style>
:root{--bg:#eaf2f4;--card:#fff;--ink:#22323a;--sub:#6b7f88;--ok:#2f9a86;--bub:#fff6d9}
@media (prefers-color-scheme:dark){:root{--bg:#15201f;--card:#1f2e2d;--ink:#e6f0ee;--sub:#92aaa5;--ok:#58c2ab;--bub:#3a3720;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.7}
main{max-width:480px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 8px}
.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:14px;background:var(--ok);color:#fff;font:inherit;font-weight:700;padding:14px;margin-top:12px;text-decoration:none;cursor:pointer}
.old{background:var(--bub)}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>🍵 ズボラ家計簿は引っ越しました</h1>
    <div class="sub">新しい場所で、今までどおり使えます。ホーム画面のアイコンも新しい場所で追加し直してね。</div>
    <a class="btn" href="https://zuborakakeibo.vercel.app/">新しいズボラ家計簿を開く</a>
    <div class="sub" style="margin-top:8px;text-align:center">https://zuborakakeibo.vercel.app/</div>
  </section>
  <section class="card old" id="old" hidden>
    <div><b>このURLに前の記録が <span id="n"></span> 件残っています。</b></div>
    <div class="sub">「書き出す」で保存して、新しいズボラ家計簿の「今月」→「⬆ 読み込む」で移せます。</div>
    <button class="btn" id="out">⬇ 書き出す</button>
    <div class="sub" id="msg" style="margin-top:8px"></div>
  </section>
</main>
<script>
// 前のアプリがこの端末に入れた Service Worker と保存ファイルを片付ける
if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes("/zubora-kakeibo/"))r.unregister()})).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.startsWith("zubora-")).forEach(k=>caches.delete(k))).catch(()=>{});
// このURLに残っている記録があれば書き出せるようにする（新しいURLとは保存場所が別のため）
let raw=null,S=null;
try{raw=localStorage.getItem("zubora_v1");S=raw&&JSON.parse(raw)}catch(e){}
const n=S?((S.items||[]).length+(S.recur||[]).length):0;
if(n){
  document.getElementById("old").hidden=false;document.getElementById("n").textContent=n;
  document.getElementById("out").onclick=async()=>{
    const d=new Date(),name="zubora-kakeibo-old-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".json";
    const text=JSON.stringify({app:"zubora-kakeibo",version:1,exportedAt:d.toISOString(),data:{goal:S.goal,items:S.items||[],recur:S.recur||[],favs:S.favs||[]}},null,1);
    const blob=new Blob([text],{type:"application/json"});
    try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"ズボラ家計簿のバックアップ"});document.getElementById("msg").textContent="書き出したよ。新しいほうで読み込んでね。";return}}
    catch(e){if(e&&e.name=="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    document.getElementById("msg").textContent="「"+name+"」を書き出したよ。新しいほうで読み込んでね。";
  };
}
</script>
</body>
</html>
